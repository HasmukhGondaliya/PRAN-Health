<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRAN Health · Home fitness and vegetarian nutrition for Gujarat</title>
<meta name="description" content="Free home workouts and practical Gujarati vegetarian meal plans in Gujarati, Hindi and English. No gym, no subscription, no account. Data stays on your device.">
<meta name="theme-color" content="#1D4D35" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111915" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%231D4D35'/%3E%3Cpath d='M20 31c-6-3-9-8-9-13 0-4 3-7 9-9 6 2 9 5 9 9 0 5-3 10-9 13z' fill='%23DCEADF'/%3E%3Ccircle cx='31' cy='11' r='3.5' fill='%23E8922A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Baloo+Bhai+2:wght@600;700&family=Mukta:wght@400;600;700&family=Mukta+Vaani:wght@400;600;700&display=swap">
<style>
:root{
  --neem:#1D4D35;--neem-2:#2A6748;--neem-ink:#123524;--tulsi:#DCEADF;--tulsi-2:#C3DBC9;--moss:#5F8A6B;
  --kesar:#E8922A;--kesar-ink:#8A4F06;--kesar-tint:#FBEBD5;--on-kesar:#1E1406;
  --bg:#FAF6EC;--surface:#FFFFFF;--surface-2:#F3EEDF;--line:#E2DAC4;--ink:#1A2A21;--ink-2:#3E5146;--muted:#56685C;
  --primary:#1D4D35;--on-primary:#FFFFFF;--link:#1D4D35;--chip-on:#1D4D35;
  --stage:#F3EDDD;--floor:#E7DEC8;--gline:#CDBF9F;
  --danger:#A3261D;--danger-tint:#FBE6E2;--info-tint:#E4EEF4;--info-ink:#1E4A66;
  --r-xl:28px;--r-l:20px;--r-m:14px;--r-s:10px;
  --shadow:0 1px 2px rgba(18,53,36,.07),0 8px 22px rgba(18,53,36,.07);
  --fh:"Baloo Bhai 2","Baloo 2",ui-rounded,system-ui,sans-serif;
  --fb:"Mukta Vaani","Mukta",system-ui,-apple-system,"Segoe UI","Noto Sans Gujarati","Noto Sans Devanagari",sans-serif;
  --navh:68px;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --neem:#7FC79C;--neem-2:#9AD6B2;--neem-ink:#CFEBDA;--tulsi:#1F3329;--tulsi-2:#2A4436;--moss:#86B394;
  --kesar-ink:#F4B66B;--kesar-tint:#3A2A14;
  --bg:#111915;--surface:#18231E;--surface-2:#1F2C26;--line:#2E3E36;--ink:#EDF3EE;--ink-2:#C6D3CA;--muted:#A3B5A9;
  --primary:#2F7552;--on-primary:#FFFFFF;--link:#9ADBB5;--chip-on:#2F7552;
  --stage:#E9E1CC;--floor:#DDD2B8;--gline:#C2B494;
  --danger:#FF9C8F;--danger-tint:#3A1E1B;--info-tint:#18303F;--info-ink:#A9D2EE;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --neem:#7FC79C;--neem-2:#9AD6B2;--neem-ink:#CFEBDA;--tulsi:#1F3329;--tulsi-2:#2A4436;--moss:#86B394;
  --kesar-ink:#F4B66B;--kesar-tint:#3A2A14;
  --bg:#111915;--surface:#18231E;--surface-2:#1F2C26;--line:#2E3E36;--ink:#EDF3EE;--ink-2:#C6D3CA;--muted:#A3B5A9;
  --primary:#2F7552;--on-primary:#FFFFFF;--link:#9ADBB5;--chip-on:#2F7552;
  --stage:#E9E1CC;--floor:#DDD2B8;--gline:#C2B494;
  --danger:#FF9C8F;--danger-tint:#3A1E1B;--info-tint:#18303F;--info-ink:#A9D2EE;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);color-scheme:dark}
:root.hc{--bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#FFFFFF;--line:#000;--ink:#000;--ink-2:#000;--muted:#000;--primary:#000;--on-primary:#FFF;--link:#00308F;--neem:#000;--tulsi:#FFF;--tulsi-2:#FFF;--kesar-tint:#FFF;--kesar-ink:#000;--chip-on:#000;--shadow:none;color-scheme:light}
:root.hc .card,:root.hc .btn,:root.hc .chip,:root.hc .panel{border:2px solid #000!important}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{font-size:100%;-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html.ts1{font-size:112.5%}html.ts2{font-size:125%}html.ts3{font-size:143.75%}
html.tv{font-size:131.25%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:1.0625rem;line-height:1.55;min-height:100%;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--fh);line-height:1.15;margin:0 0 .4em;color:var(--ink);font-weight:700;letter-spacing:-.005em}
h1{font-size:clamp(1.85rem,4.6vw,2.6rem)}h2{font-size:clamp(1.35rem,3vw,1.7rem)}h3{font-size:1.2rem}h4{font-size:1.05rem}
p{margin:0 0 .8em;max-width:68ch}
a{color:var(--link);text-underline-offset:3px}
img,svg{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--kesar);outline-offset:3px;border-radius:6px}
html.tv :focus-visible{outline-width:5px;outline-offset:4px;box-shadow:0 0 0 8px rgba(232,146,42,.25)}
.skip{position:absolute;left:-999px;top:8px;z-index:200;background:var(--primary);color:var(--on-primary);padding:.6em 1em;border-radius:10px}
.skip:focus{left:8px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:1.15em;height:1.15em;vertical-align:-.22em;flex:none}
.muted{color:var(--muted)}.small{font-size:.92rem}.tiny{font-size:.82rem}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:.75rem}
.spacer{flex:1}
/* ---------- shell ---------- */
.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);margin-top:calc(-1*env(safe-area-inset-top,0px))}
@supports not (background:color-mix(in srgb,red,blue)){.topbar{background:var(--bg)}}
.topbar-in{display:flex;align-items:center;gap:.5rem;padding:.55rem 1rem;max-width:1240px;margin:0 auto}
.logo{display:flex;align-items:center;gap:.5rem;text-decoration:none;color:var(--ink);font-family:var(--fh);font-weight:700;font-size:1.3rem;line-height:1}
.logo svg{width:34px;height:34px;flex:none}
.logo>span{white-space:nowrap}
.logo small{display:block;font-family:var(--fb);font-weight:500;font-size:.72rem;color:var(--muted);letter-spacing:.01em}
.topnav{display:none}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;padding:.35rem .7rem;min-height:40px;min-width:44px;cursor:pointer;font-weight:600}
.lang button[aria-pressed="true"]{background:var(--chip-on);color:#fff}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.iconbtn svg{width:22px;height:22px}
main{max-width:1240px;margin:0 auto;padding:1rem 1rem calc(var(--navh) + 2rem + env(safe-area-inset-bottom,0px))}
.botnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.botnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--navh);text-decoration:none;color:var(--muted);font-size:.8rem;font-weight:600}
.botnav a svg{width:24px;height:24px}
.botnav a[aria-current="page"]{color:var(--neem)}
.botnav a[aria-current="page"] svg{stroke:var(--neem)}
.botnav a[aria-current="page"]::before{content:"";position:absolute;width:42px;height:4px;border-radius:0 0 4px 4px;background:var(--kesar);transform:translateY(calc(-1*var(--navh)/2 + 2px))}
@media (min-width:1024px){
  .app{display:grid;grid-template-columns:250px 1fr}
  .side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);padding:1.1rem .9rem;display:flex;flex-direction:column;gap:.25rem;background:var(--surface)}
  .side .logo{padding:.3rem .5rem 1rem}
  .side a.nav{display:flex;align-items:center;gap:.7rem;padding:.65rem .75rem;border-radius:12px;text-decoration:none;color:var(--ink-2);font-weight:600}
  .side a.nav svg{width:22px;height:22px;flex:none}
  .side a.nav:hover{background:var(--surface-2)}
  .side a.nav[aria-current="page"]{background:var(--tulsi);color:var(--ink)}
  .botnav,.topbar .logo{display:none}
  .topbar-in{justify-content:flex-end}
  main{padding:1.5rem 2rem 3rem}
}
@media (max-width:1023.98px){.side{display:none}}
/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:48px;padding:.6rem 1.15rem;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer;text-decoration:none;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--moss)}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.start{background:var(--kesar);border-color:var(--kesar);color:var(--on-kesar);border-radius:999px;min-height:56px;padding:.7rem 1.6rem;font-size:1.08rem}
.btn.ghost{background:transparent;border-color:transparent;color:var(--link);text-decoration:underline;text-underline-offset:3px;padding-inline:.4rem}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:40px;padding:.35rem .8rem;font-size:.94rem;border-radius:12px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.chips{display:flex;gap:.45rem;flex-wrap:wrap}
.chip{min-height:42px;padding:.35rem .9rem;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:.35rem}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--chip-on);border-color:var(--chip-on);color:#fff}
.chip[aria-pressed="true"]::before,.chip[aria-checked="true"]::before{content:"✓";font-weight:800}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:1rem}
.card.tap{cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease}
.card.tap:hover{transform:translateY(-2px)}
a.card{display:block;text-decoration:none;color:inherit}
.panel{background:var(--tulsi);border-radius:var(--r-xl);padding:1.25rem}
.note{border-radius:var(--r-m);padding:.85rem 1rem;background:var(--info-tint);color:var(--info-ink);border:1px solid transparent}
.note.warn{background:var(--kesar-tint);color:var(--ink)}
.note.danger{background:var(--danger-tint);color:var(--ink);border-color:var(--danger)}
.note b{color:inherit}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr))}
.sec{margin:2rem 0}
.sec-h{display:flex;align-items:end;gap:1rem;justify-content:space-between;margin-bottom:.8rem;flex-wrap:wrap}
.sec-h h2{margin:0}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.12rem .55rem;border-radius:999px;font-size:.82rem;font-weight:700;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.pill.ev-est{background:#E1F0E6;color:#1C4A30;border-color:#B7D7C2}
.pill.ev-sup{background:#E2ECF5;color:#1E4A66;border-color:#BCD3E6}
.pill.ev-lim{background:#FBEBD5;color:#6E3F05;border-color:#F0CF9F}
:root[data-theme="dark"] .pill.ev-est,:root[data-theme="dark"] .pill.ev-sup,:root[data-theme="dark"] .pill.ev-lim{filter:brightness(.95)}
.dots{display:inline-flex;gap:3px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}.dots i.on{background:var(--neem)}
input[type=text],input[type=number],input[type=search],input[type=time],select,textarea{min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:.5rem .8rem;width:100%}
label.f{display:block;font-weight:700;margin:.6rem 0 .3rem}
fieldset{border:0;padding:0;margin:0 0 1rem}legend{font-weight:700;margin-bottom:.45rem;padding:0;font-family:var(--fh);font-size:1.08rem}
.switch{display:flex;align-items:center;gap:.7rem;min-height:48px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--neem)}
hr{border:0;border-top:1px solid var(--line);margin:1.5rem 0}
details>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:.6rem;min-height:52px;font-weight:700;font-family:var(--fh);font-size:1.12rem}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";margin-left:auto;font-size:1.4rem;color:var(--muted);width:1.5rem;text-align:center}
details[open]>summary::after{content:"–"}
details.acc{border-top:1px solid var(--line)}
details.acc:last-child{border-bottom:1px solid var(--line)}
details.acc .acc-b{padding:0 0 1rem}
/* ---------- figures ---------- */
.fig{display:block;width:100%;height:auto;background:var(--stage);border-radius:var(--r-m)}
.fig-floor{fill:var(--floor)}.fig-gline{stroke:var(--gline);stroke-width:1.5}
.stage{border-radius:var(--r-m);overflow:hidden;background:var(--stage)}
.frames{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.frames figure{margin:0;position:relative}
.frames figcaption{font-size:.88rem;font-weight:700;margin-top:.25rem;display:flex;gap:.4rem;align-items:center}
.frames figcaption b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--neem);color:var(--bg);font-size:.8rem}
/* ---------- home ---------- */
.hero{display:grid;gap:1.2rem;align-items:center;background:var(--tulsi);border-radius:var(--r-xl);padding:1.4rem;overflow:hidden}
.hero h1{font-size:clamp(2.1rem,6.2vw,3.5rem);line-height:1.02;margin-bottom:.5rem}
.hero h1 span{display:block}
.hero h1 span:nth-child(2){padding-left:.5ch}.hero h1 span:nth-child(3){padding-left:1ch}
.hero p{font-size:1.12rem;color:var(--ink-2)}
.hero-art{border-radius:var(--r-l);overflow:hidden;background:#EFE6D2}
.hero-art>svg{display:block;width:100%;height:auto}
@media (min-width:860px){.hero{grid-template-columns:1.05fr 1fr;padding:2.2rem}}
.qs{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
@media (min-width:860px){.qs{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.9rem}}
.qcard{display:flex;flex-direction:column;gap:.5rem;padding:.75rem;border-radius:var(--r-l)}
.qcard h3{margin:.2rem 0 0;font-size:1.15rem}
.meta{display:flex;gap:.35rem;flex-wrap:wrap}
.goal{display:flex;flex-direction:column;align-items:flex-start;gap:.4rem;padding:.6rem;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-height:100%}
.goal .fig{border-radius:12px}
.goal span{font-weight:700;font-family:var(--fh);font-size:1.05rem;line-height:1.2;padding:0 .2rem .2rem}
.today{display:grid;gap:1rem}
@media (min-width:860px){.today{grid-template-columns:1.2fr 1fr}}
.ring{width:96px;height:96px;flex:none}
.ring circle{fill:none;stroke-width:10}
.ring .bgc{stroke:var(--surface-2)}.ring .fgc{stroke:var(--kesar);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.8rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:.8rem 1rem}
.stat b{display:block;font-family:var(--fh);font-size:1.8rem;line-height:1.1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:.35rem}
.week div{text-align:center;padding:.35rem 0;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:.82rem}
.week div.on{background:var(--neem);color:var(--bg);border-color:var(--neem)}
.week div.today{outline:2px solid var(--kesar);outline-offset:1px}
.week b{display:block;font-size:1rem}
.spot{display:grid;gap:1.2rem;align-items:center}
@media (min-width:860px){.spot{grid-template-columns:minmax(260px,380px) 1fr}}
.spot ul{padding-left:1.1rem;margin:.3rem 0 1rem}
/* ---------- library ---------- */
.toolbar{display:grid;gap:.7rem;margin-bottom:1rem}
.excard{display:flex;flex-direction:column;gap:.4rem;padding:.6rem;border-radius:var(--r-l)}
.excard h3{font-size:1.06rem;margin:.15rem .2rem 0}
.excard .sub{margin:0 .2rem;font-size:.9rem;color:var(--muted)}
.excard .meta{margin:0 .2rem .2rem}
.empty{text-align:center;padding:2.5rem 1rem;border:2px dashed var(--line);border-radius:var(--r-l);color:var(--muted)}
.empty h3{color:var(--ink)}
/* ---------- detail ---------- */
.dhead{display:grid;gap:1.2rem}
@media (min-width:900px){.dhead{grid-template-columns:minmax(320px,1fr) 1fr;align-items:start}}
.names{display:flex;flex-wrap:wrap;gap:.3rem .9rem;color:var(--muted);font-size:1.02rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.6rem;margin:1rem 0}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.55rem .75rem}
.facts span{display:block;font-size:.8rem;color:var(--muted);font-weight:700}
ol.steps{padding-left:0;list-style:none;counter-reset:s;margin:.4rem 0 1rem}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:2rem 1fr;gap:.6rem;margin-bottom:.55rem}
ol.steps li::before{content:counter(s);display:grid;place-items:center;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--tulsi);font-weight:800;color:var(--ink)}
.ben{list-style:none;padding:0;margin:0}
.ben li{padding:.7rem 0;border-bottom:1px solid var(--line)}
.ben li:last-child{border-bottom:0}
.ben .row{margin-bottom:.25rem}
.musc{display:grid;gap:1rem;align-items:center}
@media (min-width:640px){.musc{grid-template-columns:minmax(220px,300px) 1fr}}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.9rem}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:.3rem}
.refs{padding-left:1.1rem}.refs li{margin-bottom:.6rem}
/* ---------- builder / workouts ---------- */
.tabs{display:flex;gap:.35rem;overflow-x:auto;padding-bottom:.3rem;margin-bottom:1rem;scrollbar-width:thin}
.tabs [role=tab]{flex:none;min-height:46px;padding:.4rem 1rem;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.tabs [role=tab][aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.wlist{list-style:none;padding:0;margin:0}
.wlist li{display:grid;grid-template-columns:64px 1fr auto;gap:.7rem;align-items:center;padding:.45rem 0;border-bottom:1px solid var(--line)}
.wlist .fig{border-radius:10px}
.phase-lab{font-size:.85rem;font-weight:800;color:var(--muted);margin:.9rem 0 .2rem}
.prog{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.daygrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.4rem}
.daygrid button{min-height:58px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.85rem;padding:.2rem;line-height:1.15}
.daygrid button.rest{background:var(--surface-2);color:var(--muted)}
.daygrid button.done{background:var(--neem);color:var(--bg);border-color:var(--neem)}
.daygrid button.cur{outline:3px solid var(--kesar);outline-offset:1px}
/* ---------- diet ---------- */
.thali{display:block;width:100%;height:auto}
.meals{display:grid;gap:1rem}
.meal{display:grid;gap:.8rem;grid-template-columns:96px 1fr;align-items:start}
@media (min-width:640px){.meal{grid-template-columns:140px 1fr}}
.meal h3{margin:0 0 .2rem;font-size:1.1rem}
.nutr{display:flex;gap:.35rem;flex-wrap:wrap;margin:.35rem 0}
.ing{list-style:none;padding:0;margin:.4rem 0}
.ing li{display:flex;align-items:center;gap:.6rem;padding:.35rem 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.slot-h{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.slot-h input[type=time]{width:auto;min-height:40px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.qty button{min-width:42px;min-height:40px;border:0;background:var(--surface);cursor:pointer;font-weight:800;font-size:1.1rem}
.qty span{padding:0 .5rem;font-weight:700;min-width:3.5ch;text-align:center}
table.t{width:100%;border-collapse:collapse;font-size:.95rem}
table.t th,table.t td{text-align:left;padding:.5rem .4rem;border-bottom:1px solid var(--line);vertical-align:top}
.tscroll{overflow-x:auto}
/* ---------- progress ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem}
.cal div{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-size:.88rem;background:var(--surface);border:1px solid var(--line);position:relative}
.cal div.h{background:none;border:0;font-weight:800;color:var(--muted);aspect-ratio:auto;padding:.2rem 0}
.cal div.on{background:var(--neem);color:var(--bg);border-color:var(--neem);font-weight:800}
.cal div.x{visibility:hidden}
.cal div.today{outline:2px solid var(--kesar)}
.bars{width:100%;height:auto}
.bars text{fill:var(--muted);font-size:11px;font-family:var(--fb)}
.bars .b{fill:var(--neem)}
.hist li{display:flex;gap:.8rem;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--line)}
.hist{list-style:none;padding:0;margin:0}
.habit{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.5rem 0;border-bottom:1px solid var(--line)}
.habit .hd{display:flex;gap:4px}
.habit .hd button{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:.72rem;font-weight:700}
.habit .hd button[aria-pressed="true"]{background:var(--neem);color:var(--bg);border-color:var(--neem)}
/* ---------- dialog ---------- */
dialog{border:0;border-radius:var(--r-l);padding:0;max-width:min(560px,94vw);width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,20,15,.55)}
.dlg{padding:1.2rem 1.2rem 1rem;max-height:86vh;overflow:auto}
.dlg-f{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;padding:.8rem 1.2rem 1.1rem;border-top:1px solid var(--line)}
.ob-step{min-height:240px}
.ob-dots{display:flex;gap:6px;margin-bottom:.8rem}.ob-dots i{height:6px;flex:1;border-radius:3px;background:var(--line)}.ob-dots i.on{background:var(--kesar)}
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:12px;z-index:300;font-weight:600;max-width:92vw;box-shadow:var(--shadow)}
@media (min-width:1024px){.toast{bottom:24px}}
/* ---------- player ---------- */
.player{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:auto}
.pl-top{display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem}
.pl-top h2{font-size:1.05rem;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.segs{display:flex;gap:3px;padding:0 1rem}
.segs i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.segs i.d{background:var(--neem)}.segs i.s{background:repeating-linear-gradient(45deg,var(--line),var(--line) 3px,var(--surface-2) 3px,var(--surface-2) 6px)}.segs i.c{background:var(--kesar)}
.pl-body{flex:1;display:grid;gap:1rem;padding:1rem;align-content:start;max-width:1400px;width:100%;margin:0 auto}
@media (min-width:900px) and (min-height:560px){.pl-body{grid-template-columns:1.25fr 1fr;align-items:center}}
.pl-fig .stage{background:none;display:flex;justify-content:center}
.pl-fig .fig{width:min(100%,calc(58vh * 1.2));height:auto}
.pl-info{display:flex;flex-direction:column;gap:.7rem}
.pl-phase{font-weight:800;color:var(--kesar-ink);font-size:1rem}
.pl-name{font-size:clamp(1.6rem,4vw,2.6rem);margin:0}
.pl-cue{font-size:1.15rem;color:var(--ink-2);margin:0}
.timer{display:flex;align-items:center;gap:1rem}
.timer svg{width:clamp(110px,18vw,180px);height:auto}
.timer .num{font-family:var(--fh);font-size:clamp(2.6rem,7vw,4.4rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ctrls{display:flex;gap:.6rem;flex-wrap:wrap}
.ctrls .btn{min-height:60px;min-width:60px;font-size:1.05rem;border-radius:16px}
.next{display:grid;grid-template-columns:84px 1fr;gap:.7rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:.5rem}
.next .fig{border-radius:10px}
html.tv .player .ctrls .btn{min-height:84px;min-width:84px;font-size:1.3rem}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem}
.rpe{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:.4rem}
.rpe button{min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;padding:.3rem}
.rpe button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
/* ---------- misc ---------- */
.foot{margin-top:3rem;padding-top:1.2rem;border-top:1px solid var(--line);font-size:.92rem;color:var(--muted)}
.kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 .35rem;font-size:.85rem;background:var(--surface)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
html.rm *{transition:none!important;animation:none!important}
@media print{
  body{background:#fff;color:#000}
  .side,.topbar,.botnav,.noprint,.foot,.skip{display:none!important}
  main{padding:0;max-width:none}
  .print-only{display:block!important}
  table.t th,table.t td{border:1px solid #000;padding:.6rem}
}
.print-only{display:none}

@media (max-width:480px){.logo small{display:none}.logo{font-size:1.1rem;gap:.35rem}.logo svg{width:30px;height:30px}.lang button{min-width:38px;padding:.3rem .45rem}.topbar-in{gap:.35rem;padding:.5rem .6rem}.iconbtn{width:42px;height:42px}}
@media (max-width:350px){.topbar a.iconbtn{display:none!important}}
@media (max-width:560px){.g3{grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}.excard h3{font-size:.98rem}.qcard h3{font-size:1rem}}
.meta .pill{white-space:normal;line-height:1.25;padding-top:.2rem;padding-bottom:.2rem}
</style>
</head>

/* ===== TV remote / keyboard spatial navigation ===== */
const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"]),summary';
function spatial(dir) {
  const scope = openDlg ? openDlg.el : ($('#player') || document);
  const els = $$(FOCUSABLE, scope).filter(el => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0 && r.right > 0 && !el.closest('[hidden]'); });
  const cur = document.activeElement;
  if (!cur || els.indexOf(cur) < 0) { if (els[0]) els[0].focus(); return true; }
  const r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bs = 1e9;
  els.forEach(el => {
    if (el === cur) return; const q = el.getBoundingClientRect(), x = q.left + q.width / 2, y = q.top + q.height / 2;
    let main, side;
    if (dir === 'ArrowRight') { if (q.left < r.right - 4) return; main = q.left - r.right; side = Math.abs(y - cy); }
    else if (dir === 'ArrowLeft') { if (q.right > r.left + 4) return; main = r.left - q.right; side = Math.abs(y - cy); }
    else if (dir === 'ArrowDown') { if (q.top < r.bottom - 4) return; main = q.top - r.bottom; side = Math.abs(x - cx); }
    else { if (q.bottom > r.top + 4) return; main = r.top - q.bottom; side = Math.abs(x - cx); }
    const sc = main + side * 2.2; if (sc < bs) { bs = sc; best = el; }
  });
  if (best) { best.focus(); if (best.scrollIntoView) best.scrollIntoView({ block: 'nearest', inline: 'nearest' }); return true; }
  return false;
}
document.addEventListener('keydown', e => {
  const a = document.activeElement, typing = a && (a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || (a.tagName === 'INPUT' && ['checkbox', 'radio', 'button'].indexOf(a.type) < 0));
  const back = e.key === 'Escape' || e.keyCode === 10009 || e.keyCode === 461 || (e.key === 'Backspace' && !typing);
  if (back) {
    if (openDlg) { e.preventDefault(); openDlg.close(null); return; }
    if (window.Player && Player.isOpen()) { e.preventDefault(); Player.requestEnd(); return; }
    if (e.key !== 'Escape' && isTV() && location.hash.length > 3) { e.preventDefault(); history.back(); return; }
  }
  if (/^Arrow/.test(e.key) && !typing && isTV()) { if (spatial(e.key)) e.preventDefault(); }
});

/* ===== Diet planner ===== */
const SLOTS = [['b', 'b', 'slotB', '07:30'], ['m', 's', 'slotM', '10:30'], ['l', 'l', 'slotL', '13:00'], ['e', 's', 'slotE', '17:00'], ['d', 'd', 'slotD', '20:00']];
const DEF_PREFS = { dairy: true, og: true, root: true, allergies: [], spice: 'medium', budget: false, season: 'auto' };
function dietState() {
  const p = prof(), st = D('diet', null) || {};
  st.plan = st.plan || (p.ageGroup === 'child' ? 'child' : p.ageGroup === 'older' ? 'older' : 'general');
  st.prefs = Object.assign({}, DEF_PREFS, p.diet || {}, st.prefs || {});
  st.slots = st.slots || {};
  return st;
}
const curSeason = pr => pr.season && pr.season !== 'auto' ? pr.season : Object.keys(SEASONS).find(k => SEASONS[k].months.indexOf(new Date().getMonth()) >= 0);
function violates(fid, pr) {
  const f = FOODS[fid]; if (!f) return false; const tg = f.tags;
  if (!pr.dairy && tg.indexOf('dairy') >= 0) return 'dairy';
  if (!pr.og && tg.indexOf('og') >= 0) return 'og';
  if (!pr.root && tg.indexOf('root') >= 0) return 'root';
  for (const a of pr.allergies || []) if (tg.indexOf(a) >= 0) return a;
  return false;
}
/* apply season, user swaps and preference replacements; never silently keep a forbidden food */
function adaptMeal(meal, pr, swaps) {
  const notes = []; let ok = true; const out = [];
  meal.items.forEach(([fid, g]) => {
    let id = fid;
    if (meal.seasonal && FOODS[id].grp === 'fruit' && !(swaps && swaps[fid])) id = SEASONS[curSeason(pr)].fruit[0];
    if (swaps && swaps[fid]) id = swaps[fid];
    let guard = 0, why;
    while ((why = violates(id, pr)) && guard++ < 4) {
      const map = PREFSWAP[why === 'gluten' ? 'gluten' : why] || {};
      if (map.hasOwnProperty(id)) { const nx = map[id]; notes.push(nx ? t('autoSwap', { a: L(FOODS[id].name), b: L(FOODS[nx].name) }) : t('autoDrop', { a: L(FOODS[id].name) })); if (!nx) { id = null; break; } id = nx; }
      else { ok = false; break; }
    }
    if (id && !violates(id, pr)) out.push([id, g, fid]);
    else if (id) { if (['dairy', 'drink', 'fat', 'nut', 'fruit'].indexOf(FOODS[fid].grp) >= 0) notes.push(t('autoDrop', { a: L(FOODS[fid].name) })); else ok = false; }
  });
  return { items: out, notes, ok };
}
function nutr(items, mult) {
  const n = { kcal: 0, p: 0, c: 0, f: 0, fi: 0 };
  items.forEach(([id, g]) => { const f = FOODS[id], k = g / 100 * mult; n.kcal += f.kcal * k; n.p += f.p * k; n.c += f.c * k; n.f += f.f * k; n.fi += f.fi * k; });
  return n;
}
const rnd = (v, s) => Math.round(v / s) * s;
const nutrPills = n => `<div class="nutr"><span class="pill">≈ ${rnd(n.kcal, 10)} kcal</span><span class="pill">≈ ${Math.round(n.p)} g ${esc(t('protein'))}</span><span class="pill">≈ ${rnd(n.c, 5)} g ${esc(t('carbs'))}</span><span class="pill">≈ ${Math.round(n.f)} g ${esc(t('fat'))}</span><span class="pill">≈ ${Math.round(n.fi)} g ${esc(t('fibre'))}</span></div>`;
function mealFor(slotKey, slotType, st) {

/* ===== ONBOARDING (optional, short, skippable) ===== */
function onboarding() {
  const p = prof(), st = { lang: SET.lang, ageGroup: p.ageGroup, exp: p.exp, goal: p.goal, time: p.time, intensity: p.intensity, equip: p.equip.slice(), space: p.space, limits: p.limits.slice(), diet: Object.assign({ dairy: true, og: true, root: true, allergies: [] }, p.diet) };
  const steps = [
    () => `<fieldset><legend>${esc(t('obLang'))}</legend>${chipGroup('lang', [['en', 'English'], ['gu', 'ગુજરાતી'], ['hi', 'हिन्दी']], st.lang)}</fieldset>`,
    () => `<fieldset><legend>${esc(t('obAge'))}</legend>${chipGroup('age', AGEO().concat([['none', t('preferNot')]]), st.ageGroup || 'none')}<p class="small muted">${esc(t('obAgeWhy'))}</p>${st.ageGroup === 'child' ? `<p class="note warn small">${esc(t('childHint'))}</p>` : ''}</fieldset>`,
    () => `<fieldset><legend>${esc(t('obExp'))}</legend>${chipGroup('exp', EXPO(), st.exp)}</fieldset><fieldset><legend>${esc(t('obGoal'))}</legend>${chipGroup('goal', Object.keys(GOALS).map(g => [g, L(GOALS[g].n)]), st.goal)}</fieldset>`,
    () => `<fieldset><legend>${esc(t('obTime'))}</legend>${chipGroup('dur', [5, 10, 15, 20, 30, 45].map(d => [d, t('minutesN', { n: d })]), st.time)}</fieldset><fieldset><legend>${esc(t('intensity'))}</legend>${chipGroup('int', [['low', t('intLow')], ['moderate', t('intMod')], ['vigorous', t('intVig')]], st.intensity)}<p class="small muted">${esc(t('intHelp'))}</p></fieldset>`,
    () => `<fieldset><legend>${esc(t('obEquip'))}</legend>${chipGroup('eq', EQO(), st.equip, true)}<p class="small muted">${esc(t('equipHelp'))}</p></fieldset><fieldset><legend>${esc(t('space'))}</legend>${chipGroup('space', [['small', t('spaceSmall')], ['medium', t('spaceMed')]], st.space)}</fieldset>`,
    () => `<fieldset><legend>${esc(t('obLimits'))}</legend><p class="small muted">${esc(t('limitsWhy'))}</p>${chipGroup('lim', LIMO(), st.limits, true)}</fieldset>`,
    () => `<fieldset><legend>${esc(t('obDiet'))}</legend><p class="small muted">${esc(t('obDietWhy'))}</p>${chipGroup('dairy', [['1', t('dairyYes')], ['0', t('dairyNo')]], st.diet.dairy ? '1' : '0')}<div style="height:.5rem"></div>${chipGroup('og', [['1', t('ogYes')], ['0', t('ogNo')]], st.diet.og ? '1' : '0')}<p class="small" style="margin:.6rem 0 .3rem"><b>${esc(t('allergiesQ'))}</b></p>${chipGroup('allg', ALLERGY.map(a => [a, t('al_' + a)]), st.diet.allergies, true)}</fieldset>`
  ];
  let i = 0;
  const read = d => {
    const v = (g, mu) => readChips(d, g, mu);
    if (i === 0 && v('lang')) { st.lang = v('lang'); }
    if (i === 1) { const a = v('age'); st.ageGroup = a === 'none' ? null : a; }
    if (i === 2) { st.exp = v('exp') || st.exp; st.goal = v('goal') || st.goal; }
    if (i === 3) { st.time = +(v('dur') || st.time); st.intensity = v('int') || st.intensity; }
    if (i === 4) { st.equip = v('eq', true); st.space = v('space') || st.space; }
    if (i === 5) st.limits = v('lim', true);
    if (i === 6) { st.diet.dairy = v('dairy') !== '0'; st.diet.og = v('og') !== '0'; st.diet.allergies = v('allg', true); }
  };
  const finish = () => {
    if (st.ageGroup === 'child' && st.goal === 'weight') st.goal = 'kids';
    if (st.ageGroup === 'child') st.goal = 'kids';
    if ((st.ageGroup === 'older' || st.ageGroup === 'child' || !st.ageGroup || st.exp === 'beginner') && st.intensity === 'vigorous') st.intensity = 'moderate';
    saveSettings({ lang: st.lang });
    saveProf({ ageGroup: st.ageGroup, exp: st.exp, goal: st.goal, time: st.time, intensity: st.intensity, equip: st.equip, space: st.space, limits: st.limits, diet: st.diet, onboarded: true });
    const ds = D('diet', null); if (ds) { ds.prefs = Object.assign({}, ds.prefs, st.diet); S('diet', ds); }
    renderShell(); route(); toast(t('obDone'));
  };
  const show = () => {
    const body = `<div class="ob-dots" aria-hidden="true">${steps.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div><p class="small muted">${esc(t('stepOf', { a: i + 1, b: steps.length }))}</p><div class="ob-step">${steps[i]()}</div><p class="tiny muted">${esc(t('obPrivacy'))}</p>`;
